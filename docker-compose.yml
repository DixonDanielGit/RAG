services:
  backend:
    build: ./backend
    container_name: rag_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Sincroniza la carpeta 'data' local con la carpeta '/app/data' del contenedor 
      # para asegurar la persistencia de ChromaDB y los archivos subidos.
      - ./data:/app/data
      - ./frontend:/app/frontend    # <--- AÑADIR ESTA LÍNEA
    networks:
      - rag_network

networks:
  rag_network:
    driver: bridge